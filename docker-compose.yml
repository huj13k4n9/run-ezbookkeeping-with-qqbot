# QQ 记账机器人（qqbot + pi agent 单容器）
#
#   cp .env.example .env      # 填 QQ_BOT_*、EBKTOOL_*、模型 key、（可选）LANGFUSE_*
#   mkdir -p data && sudo chown -R 10001:10001 data   # 见下方 data 卷的说明
#   docker compose up -d --build
#   docker compose logs -f
#
# 想从宿主机先手动验证 agent：
#   docker compose run --rm --entrypoint pi qqbot --print --tools bash,read -- "记 30 午饭"
#
# 想看 Langfuse 是否生效（插件自己的调试日志）：
#   PI_LANGFUSE_DEBUG=true docker compose run --rm qqbot

name: qq-bookkeeping

services:
  qqbot:
    build:
      context: .
      args:
        PI_VERSION: ${PI_VERSION:-0.87.1}
        # 构建时预装扩展；和下面的运行期变量保持一致
        PI_EXTENSIONS: ${PI_EXTENSIONS:-npm:@langfuse/pi-observability-plugin}
    image: qq-bookkeeping:${PI_VERSION:-0.87.1}
    container_name: qq-bookkeeping
    restart: unless-stopped

    # pi 会 fork bash，init 负责收尸，避免僵尸进程堆积
    init: true

    # .env 里的所有变量都会注入容器。
    # 注意：Langfuse 的 key/baseUrl **不在环境变量里**，而是放在
    # pi-config/langfuse.json（见那个目录下的 .example）—— 那个目录烤在镜像里，
    # 改了要 docker compose up -d --build。
    env_file:
      - .env
    environment:
      TZ: ${TZ:-Asia/Shanghai}

      # ebktools.sh 启动时会自检这两个变量，缺一个就直接报错退出
      EBKTOOL_SERVER_BASEURL: ${EBKTOOL_SERVER_BASEURL:?请在 .env 里设置 EBKTOOL_SERVER_BASEURL}
      EBKTOOL_TOKEN: ${EBKTOOL_TOKEN:?请在 .env 里设置 EBKTOOL_TOKEN}

      # 容器内的绝对路径：与宿主机上这些目录放在哪儿无关
      QQ_BOT_AGENT_CWD: /app/agent
      QQ_BOT_EBKTOOLS_PATH: /app/.agents/skills/ezbookkeeping/scripts/ebktools.sh
      QQ_BOT_AUTO_DOWNLOAD_DIR: /app/data/media

      # pi 的配置目录。目录本身在镜像里（含构建期预装的扩展声明），
      # 只有 models.json / langfuse.json 两个文件从宿主机挂进来。
      PI_CODING_AGENT_DIR: /app/pi-config
      # 会话是运行期数据，放 data/ 里
      PI_CODING_AGENT_SESSION_DIR: /app/data/pi-sessions
      # 入口脚本会幂等安装这里的 pi 扩展包；留空则跳过
      PI_EXTENSIONS: ${PI_EXTENSIONS:-npm:@langfuse/pi-observability-plugin}

    volumes:
      # 图片落盘 + 引用索引 + pi 会话。**必须持久化** ——
      # 引用回查依赖已落盘的图片文件。
      # 注意：绑定挂载时宿主机目录的属主说了算。容器内跑的是 uid 10001，
      # 所以首次要先执行：mkdir -p data && sudo chown -R 10001:10001 data
      - ./data:/app/data

      # pi 的两个配置文件。逐文件挂载而不是挂整个目录，好处：
      #   * langfuse.json 里的密钥不会留在镜像层
      #   * 改完只需 docker compose restart（不用 rebuild）
      #   * settings.json / auth.json / 扩展包留在容器与镜像里，不污染仓库
      #
      # ⚠️ 宿主机上这两个文件**必须先存在**。否则 Docker 会建一个同名目录
      #    挂进来，pi 解析 JSON 会失败（入口脚本会检测并报错）。
      #       cp pi-config/models.json.example   pi-config/models.json
      #       cp pi-config/langfuse.json.example pi-config/langfuse.json
      - ./pi-config/models.json:/app/pi-config/models.json:ro
      - ./pi-config/langfuse.json:/app/pi-config/langfuse.json:ro

      # 约束文件 / 官方工具脚本 / skill：只读挂载，改完不用重建镜像。
      # 这些目录不在本仓库下时，在 .env 里设 AGENT_DIR / AGENTS_SKILLS_DIR。
      - ${AGENT_DIR:-./agent}:/app/agent:ro
      - ${AGENTS_SKILLS_DIR:-./.agents}:/app/.agents:ro

    # agent 最长会跑 QQ_BOT_AGENT_TIMEOUT（默认 120s），给足退出时间
    stop_grace_period: 130s

    security_opt:
      - no-new-privileges:true

    cpus: 1.5
    mem_limit: 1g
    # node + ripgrep + bash 子进程会占一些 pid，给宽一点避免 fork 失败
    pids_limit: 512

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
